<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="github-harness-title github-harness-desc">
    <title id="github-harness-title">사주 서비스 하네스 워크플로우</title>
    <desc id="github-harness-desc">사람의 요청이 하네스 규칙을 거쳐 에이전트 구현 결과로 이어지고, 평가가 실패하면 다시 에이전트로 돌아가는 검증 흐름입니다.</desc>
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#34415f"/></marker>
      <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c05640"/></marker>
    </defs>

    <!-- Connectors are placed before nodes so cards remain visually clean. -->
    <path class="line" d="M125 184H180"/><path class="line" d="M320 184H385"/><path class="line" d="M535 184H600"/>
    <path class="line" d="M460 108V143"/><path class="line" d="M140 383H210"/><path class="line" d="M365 383H430"/><path class="line" d="M570 383H625"/>
    <path class="feedback" d="M500 423V478H460V225"/>
    <path class="line" d="M818 182V218"/><path class="line" d="M818 291V327"/>

    <g><rect class="node" x="25" y="143" width="100" height="82" rx="12"/><text class="label" x="75" y="177" text-anchor="middle">사람의 요청</text><text class="small" x="75" y="200" text-anchor="middle">목표 · 기준</text></g>
    <g><rect class="node primary" x="180" y="143" width="140" height="82" rx="12"/><text class="label" x="250" y="177" text-anchor="middle">harness.md</text><text class="small" x="250" y="200" text-anchor="middle">운영 규칙</text></g>
    <g><rect class="node primary" x="385" y="143" width="150" height="82" rx="12"/><text class="label" x="460" y="177" text-anchor="middle">Codex 에이전트</text><text class="small" x="460" y="200" text-anchor="middle">구현 · 수정</text></g>
    <g><rect class="node" x="385" y="38" width="150" height="70" rx="12"/><text class="label" x="460" y="68" text-anchor="middle">AGENTS.md</text><text class="small" x="460" y="90" text-anchor="middle">절차 · 품질 기준</text></g>
    <g><rect class="node" x="600" y="143" width="125" height="82" rx="12"/><text class="label" x="662.5" y="177" text-anchor="middle">구현 결과</text><text class="small" x="662.5" y="200" text-anchor="middle">코드 · 문서</text></g>

    <text class="title" x="25" y="326">Evaluation loop</text>
    <g><rect class="node" x="25" y="348" width="115" height="70" rx="12"/><text class="label" x="82.5" y="378" text-anchor="middle">evals.json</text><text class="small" x="82.5" y="399" text-anchor="middle">품질 사례</text></g>
    <g><rect class="node primary" x="210" y="348" width="155" height="70" rx="12"/><text class="label" x="287.5" y="378" text-anchor="middle">npm run harness</text><text class="small" x="287.5" y="399" text-anchor="middle">자동 검증</text></g>
    <g><rect class="node" x="430" y="348" width="140" height="70" rx="12"/><text class="label" x="500" y="378" text-anchor="middle">판정</text><text class="small" x="500" y="399" text-anchor="middle">PASS / FAIL</text></g>
    <g><rect class="node success" x="625" y="348" width="100" height="70" rx="12"/><text class="label" x="675" y="389" text-anchor="middle">완료</text></g>
    <text class="pass" x="590" y="368">PASS</text><text class="fail" x="512" y="465">FAIL · 수정 반복</text>

    <g><rect class="system" x="760" y="38" width="175" height="380" rx="18"/><text class="title" x="847.5" y="72" text-anchor="middle">Agent System</text>
      <rect class="layer" x="785" y="108" width="125" height="74" rx="12"/><text class="label" x="847.5" y="140" text-anchor="middle">Model</text><text class="small" x="847.5" y="161" text-anchor="middle">추론</text>
      <rect class="layer" x="785" y="218" width="125" height="73" rx="12"/><text class="label" x="847.5" y="249" text-anchor="middle">Harness</text><text class="small" x="847.5" y="270" text-anchor="middle">규칙 · 평가</text>
      <rect class="layer" x="785" y="327" width="125" height="65" rx="12"/><text class="label" x="847.5" y="355" text-anchor="middle">Environment</text><text class="small" x="847.5" y="376" text-anchor="middle">파일 · API · DB</text>
    </g>
  </svg>
