<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>하네스 시각화 방식 비교</title>
  <style>
    *{box-sizing:border-box} body{margin:0;background:#f5f7fb;color:#17213d;font-family:system-ui,"Noto Sans KR",sans-serif}
    main{width:min(980px,calc(100% - 32px));margin:32px auto;background:#fff;border:1px solid #d9deea;padding:28px}
    h1{margin:0 0 6px;font-size:26px} p{margin:0 0 22px;color:#64708d}
    svg{width:100%;height:auto;display:block}.axis{stroke:#d9deea}.label{font-size:13px;fill:#17213d}.small{font-size:11px;fill:#64708d}
    .data{fill:#3159d6}.figma{fill:#8d72d9}.github{fill:#55a6a3}
  </style>
</head>
<body>
<main>
  <h1>하네스 시각화 방식 비교</h1>
  <p>100점 만점의 검토 루브릭입니다. 사용자 선호인 레퍼런스 유사도를 우선하며, 실제 사용 데이터나 통계가 아닌 방법 비교 점수입니다.</p>
  <svg viewBox="0 0 920 470" role="img" aria-labelledby="data-compare-title data-compare-desc">
    <title id="data-compare-title">Data, Figma, GitHub diagram-maker 비교</title>
    <desc id="data-compare-desc">레퍼런스 유사도, 편집성, 정확한 배치 제어, 유지보수성, 접근성의 다섯 기준으로 세 시각화 방법을 비교합니다.</desc>
    <g class="axis"><line x1="220" y1="50" x2="220" y2="420"/><line x1="360" y1="50" x2="360" y2="420"/><line x1="500" y1="50" x2="500" y2="420"/><line x1="640" y1="50" x2="640" y2="420"/><line x1="780" y1="50" x2="780" y2="420"/><line x1="900" y1="50" x2="900" y2="420"/></g>
    <g class="small" text-anchor="middle"><text x="220" y="34">0</text><text x="360" y="34">20</text><text x="500" y="34">40</text><text x="640" y="34">60</text><text x="780" y="34">80</text><text x="900" y="34">100</text></g>
    <g class="label"><text x="8" y="78">레퍼런스 유사도</text><text x="8" y="158">편집성</text><text x="8" y="238">정확한 배치 제어</text><text x="8" y="318">유지보수성</text><text x="8" y="398">접근성</text></g>
    <g>
      <rect class="data" x="220" y="58" width="646" height="14"/><rect class="figma" x="220" y="75" width="408" height="14"/><rect class="github" x="220" y="92" width="510" height="14"/>
      <rect class="data" x="220" y="138" width="408" height="14"/><rect class="figma" x="220" y="155" width="680" height="14"/><rect class="github" x="220" y="172" width="476" height="14"/>
      <rect class="data" x="220" y="218" width="680" height="14"/><rect class="figma" x="220" y="235" width="374" height="14"/><rect class="github" x="220" y="252" width="612" height="14"/>
      <rect class="data" x="220" y="298" width="578" height="14"/><rect class="figma" x="220" y="315" width="510" height="14"/><rect class="github" x="220" y="332" width="612" height="14"/>
      <rect class="data" x="220" y="378" width="646" height="14"/><rect class="figma" x="220" y="395" width="578" height="14"/><rect class="github" x="220" y="412" width="612" height="14"/>
    </g>
    <g class="small"><rect class="data" x="220" y="445" width="12" height="12"/><text x="239" y="455">Data measured SVG</text><rect class="figma" x="402" y="445" width="12" height="12"/><text x="421" y="455">Figma FigJam</text><rect class="github" x="548" y="445" width="12" height="12"/><text x="567" y="455">GitHub diagram-maker</text></g>
  </svg>
</main>
</body>
</html>
