<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 600 296" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="saju-harness-title saju-harness-desc">
    <title id="saju-harness-title">사주 서비스 하네스 엔지니어링 워크플로우</title>
    <desc id="saju-harness-desc">사람의 요청이 harness.md를 거쳐 Codex 에이전트와 구현 결과로 이어지고, npm run harness가 실패하면 에이전트로 돌아가며 성공하면 완료됩니다. 오른쪽에는 모델, 하네스, 환경으로 구성된 에이전트 시스템이 있습니다.</desc>
